name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Content build fails on broken links, unknown components, bad frontmatter or LaTeX errors.
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle the native app (catches native-only import errors)
        run: pnpm exec expo export --platform android --output-dir dist-android

  pages:
    # Static website on GitHub Pages: https://<user>.github.io/<repo>/
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build:web
        env:
          GATYA_BASE_URL: /${{ github.event.repository.name }}
      - run: cp "dist/+not-found.html" dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  app-update:
    # Over-the-air update for installed apps (EAS Update). Skipped until the EXPO_TOKEN
    # repository secret exists; see README → "Updating the installed app".
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - if: env.EXPO_TOKEN == ''
        run: echo "::notice::EXPO_TOKEN is not set, skipping the app update."
      - if: env.EXPO_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.EXPO_TOKEN != ''
        uses: pnpm/action-setup@v4
      - if: env.EXPO_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.EXPO_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.EXPO_TOKEN != ''
        name: Publish update to installed apps
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        # "preview" is the channel the installable APK from `eas build --profile preview` listens on.
        run: pnpm dlx eas-cli update --channel preview --environment preview --platform all --message "$MESSAGE" --non-interactive
