name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Content build fails on broken links, unknown components, bad frontmatter or LaTeX errors.
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle the native app (catches native-only import errors)
        run: pnpm exec expo export --platform android --output-dir dist-android

  website:
    # Static website on Cloudflare Pages: https://<project>.pages.dev
    # main → production; pull requests → a preview URL. Skipped until the
    # CLOUDFLARE_API_TOKEN secret exists; see README → "Website".
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping the website deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: pnpm/action-setup@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm build:web
      # wrangler is a devDependency; cloudflare/wrangler-action tries to `pnpm add` it and fails.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm exec wrangler pages deploy dist --project-name=gatya --branch="$BRANCH"

  app-update:
    # Over-the-air update for installed apps (EAS Update). Skipped until the EXPO_TOKEN
    # repository secret exists; see README → "Updating the installed app".
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - if: env.EXPO_TOKEN == ''
        run: echo "::notice::EXPO_TOKEN is not set, skipping the app update."
      - if: env.EXPO_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.EXPO_TOKEN != ''
        uses: pnpm/action-setup@v4
      - if: env.EXPO_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.EXPO_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.EXPO_TOKEN != ''
        name: Publish update to installed apps
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        # "preview" is the channel the installable APK from `eas build --profile preview` listens on.
        run: pnpm dlx eas-cli update --channel preview --environment preview --platform all --message "$MESSAGE" --non-interactive
