leiras: >-
  Az 1. előadás a motivációról és a helyes következtetés gondolatáról szólt. A 2–4.
  előadás felépíti a gépezetet: a formális nyelvet (szintaxis), a formulák
  jelentését (szemantika) és a logikai következményt. A diák nagy része kézzel írt,
  ezért itt minden ki van írva és példákkal kiegészítve.
