cim: Logika a nulláról
rovid: Logika 0→ZH
szin: '#B4531A'
szin_sotet: '#F59E5B'
oktato: önálló gyakorló kurzus · a gyakorlati feladatsorok alapján
sorrend: 2.5
leiras: >-
  Lépésenként felépített kurzus az „Az informatika logikai alapjai” zárthelyijeire, a hivatalos
  tematika és az 1–4. gyakorlati feladatsor alapján. Minden lecke rövid kártyákból áll: egy gondolat,
  utána rögtön egy feladat, és csak akkor lépsz tovább, ha megoldottad. Elölről érdemes kezdeni, mert
  minden lecke az előzőkre épít.
