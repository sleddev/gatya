leiras: >-
  A laborok GeoGebrában dolgoznak: relációk, függvények illesztése és vizsgálata
  (gyökök, szélsőértékek, érintők), valamint vektorműveletek a síkon és a térben.
  Az oldalak a gyakorlati jegyzetek (relations.pdf, functions.pdf, vector
